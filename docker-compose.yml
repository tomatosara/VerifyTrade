version: "3.9"

services:
  backend:
    image: node:20
    working_dir: /workspace
    command: bash -lc "corepack enable && pnpm install && pnpm --filter @verifytrade/backend dev:api"
    volumes:
      - .:/workspace
    env_file:
      - ./app/backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    extends:
      file: ./docker-compose.db.yml
      service: db
