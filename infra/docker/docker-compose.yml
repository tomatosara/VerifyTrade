version: "3.9"
services:
postgres:
image: postgres:15
environment:
POSTGRES_PASSWORD: postgres
POSTGRES_DB: zkp
ports: ["5432:5432"]
volumes:
- pgdata:/var/lib/postgresql/data


redis:
image: redis:7
ports: ["6379:6379"]


api:
build: ../../apps/api
env_file:
- ../../apps/api/.env
depends_on: [postgres, redis]
ports: ["4000:4000"]


web:
build: ../../apps/web
environment:
- VITE_API_BASE=http://localhost:4000
ports: ["5173:5173"]


volumes:
pgdata: